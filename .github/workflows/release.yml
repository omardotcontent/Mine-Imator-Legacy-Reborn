name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_mode:
        description: 'Use an existing Git tag or create a new tag at this commit'
        type: choice
        required: true
        options:
          - create-new
          - use-existing
        default: create-new
      tag:
        description: 'Release tag (for example v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake ninja-build \
            qtbase5-dev qtbase5-dev-tools \
            libgl1-mesa-dev libomp-dev \
            libzip-dev libopenal-dev libfreetype6-dev \
            libavformat-dev libavcodec-dev libswresample-dev libswscale-dev libavutil-dev \
            pkg-config patchelf

      - name: Configure CMake
        run: |
          cmake -B build -S CppProject -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DCI_BUILD=ON

      - name: Build Mine-imator
        run: |
          cmake --build build --config Release -j$(nproc)

      - name: Package Portable Tarball
        run: |
          PACKAGE_DIR="package/Mine-imator-Legacy-Reborn-Linux-x86_64"
          rm -rf package
          mkdir -p "$PACKAGE_DIR/lib" "$PACKAGE_DIR/plugins"

          cp build/Mine-imator "$PACKAGE_DIR/"
          cp -r GmProject/datafiles/Data "$PACKAGE_DIR/"
          cp -r GmProject/datafiles/Particles "$PACKAGE_DIR/"

          # Bundle Qt5 runtime plugins so portable builds work without system Qt5
          QT_PLUGINS_DIR=$(qmake -query QT_INSTALL_PLUGINS)
          for plugin_dir in platforms imageformats xcbglintegrations; do
            if [ -d "$QT_PLUGINS_DIR/$plugin_dir" ]; then
              cp -r "$QT_PLUGINS_DIR/$plugin_dir" "$PACKAGE_DIR/plugins/"
            fi
          done

          cat << 'EOF' > "$PACKAGE_DIR/qt.conf"
          [Paths]
          Plugins = plugins
          EOF

          # Recursively collect all transitive shared libraries and patch RPATHs
          python3 - << 'EOF'
          import os
          import shutil
          import stat
          import subprocess
          from pathlib import Path

          pkg_dir = Path("package/Mine-imator-Legacy-Reborn-Linux-x86_64").resolve()
          binary = pkg_dir / "Mine-imator"
          lib_dir = pkg_dir / "lib"
          plugins_dir = pkg_dir / "plugins"

          # Host-level system/driver libraries that must match the target OS
          EXCLUDE_PREFIXES = (
              "linux-vdso.so",
              "ld-linux",
              "libc.so",
              "libm.so",
              "libpthread.so",
              "libdl.so",
              "librt.so",
              "libresolv.so",
              "libutil.so",
              "libnsl.so",
              "libnss_",
              "libstdc++.so",
              "libgcc_s.so",
              "libGL.so",
              "libGLX.so",
              "libGLdispatch.so",
              "libEGL.so",
              "libOpenGL.so",
              "libglapi.so",
              "libdrm.so",
              "libdrm_",
              "libgbm.so",
              "libvulkan.so",
              "libX11.so",
              "libX11-xcb.so",
              "libxcb.so",
              "libxcb-dri",
              "libxcb-glx",
              "libxcb-present",
              "libxcb-sync",
              "libxcb-shm",
              "libxshmfence.so",
              "libwayland-client.so",
              "libwayland-egl.so",
              "libwayland-cursor.so",
              "libasound.so",
              "libfontconfig.so",
              "libexpat.so",
              "libuuid.so",
              "libz.so",
          )

          def is_elf(path: Path) -> bool:
              try:
                  with open(path, "rb") as f:
                      return f.read(4) == b"\x7fELF"
              except OSError:
                  return False

          def make_writable(path: Path) -> None:
              mode = path.stat().st_mode
              path.chmod(mode | stat.S_IWUSR)

          to_scan = [binary]
          for so_file in plugins_dir.rglob("*.so*"):
              if so_file.is_file() and is_elf(so_file):
                  to_scan.append(so_file)

          bundled = set()
          scanned = set()

          while to_scan:
              current = to_scan.pop()
              if current in scanned:
                  continue
              scanned.add(current)

              res = subprocess.run(["ldd", str(current)], capture_output=True, text=True, check=True)
              for raw_line in res.stdout.splitlines():
                  line = raw_line.strip()
                  if "not found" in line:
                      raise RuntimeError(f"Unresolved dependency while bundling {current}: {line}")
                  if " => " not in line:
                      continue

                  lib_name, right = line.split(" => ", 1)
                  lib_name = lib_name.strip()
                  src_path = Path(right.split()[0].strip())

                  if any(lib_name.startswith(prefix) for prefix in EXCLUDE_PREFIXES):
                      continue

                  if lib_name in bundled:
                      continue

                  if not src_path.exists():
                      raise RuntimeError(f"Dependency path does not exist: {lib_name} -> {src_path}")

                  dest_path = lib_dir / lib_name
                  shutil.copy2(src_path, dest_path, follow_symlinks=True)
                  make_writable(dest_path)
                  bundled.add(lib_name)
                  to_scan.append(dest_path)

          print(f"Bundled {len(bundled)} shared libraries into {lib_dir}")

          # Force RPATH (transitive) on the executable, bundled libs, and Qt plugins
          make_writable(binary)
          subprocess.run(
              ["patchelf", "--force-rpath", "--set-rpath", "$ORIGIN/lib:$ORIGIN/Data", str(binary)],
              check=True,
          )

          for lib_file in lib_dir.iterdir():
              if lib_file.is_file() and is_elf(lib_file):
                  make_writable(lib_file)
                  subprocess.run(
                      ["patchelf", "--force-rpath", "--set-rpath", "$ORIGIN", str(lib_file)],
                      check=True,
                  )

          for plugin_file in plugins_dir.rglob("*.so*"):
              if plugin_file.is_file() and is_elf(plugin_file):
                  make_writable(plugin_file)
                  subprocess.run(
                      ["patchelf", "--force-rpath", "--set-rpath", "$ORIGIN/../../lib", str(plugin_file)],
                      check=True,
                  )
          EOF

          cd package
          tar -czvf ../Mine-imator-Legacy-Reborn-Linux-x86_64.tar.gz Mine-imator-Legacy-Reborn-Linux-x86_64
          cd ..

      - name: Verify Linux Portable Tarball
        run: |
          rm -rf /tmp/verify-linux
          mkdir -p /tmp/verify-linux
          tar -xzf Mine-imator-Legacy-Reborn-Linux-x86_64.tar.gz -C /tmp/verify-linux

          # 1. Verify RPATH resolution stays inside the extracted bundle (no leaked host FFmpeg/Qt/SRT)
          python3 - << 'EOF'
          import subprocess
          from pathlib import Path

          app_dir = Path("/tmp/verify-linux/Mine-imator-Legacy-Reborn-Linux-x86_64").resolve()
          lib_dir = app_dir / "lib"

          HOST_ALLOWED = (
              "linux-vdso.so", "ld-linux", "libc.so", "libm.so", "libpthread.so",
              "libdl.so", "librt.so", "libresolv.so", "libutil.so", "libnsl.so",
              "libnss_", "libstdc++.so", "libgcc_s.so", "libGL.so", "libGLX.so",
              "libGLdispatch.so", "libEGL.so", "libOpenGL.so", "libglapi.so",
              "libdrm.so", "libdrm_", "libgbm.so", "libvulkan.so", "libX11.so",
              "libX11-xcb.so", "libxcb.so", "libxcb-dri", "libxcb-glx",
              "libxcb-present", "libxcb-sync", "libxcb-shm", "libxshmfence.so",
              "libwayland-client.so", "libwayland-egl.so", "libwayland-cursor.so",
              "libasound.so", "libfontconfig.so", "libexpat.so", "libuuid.so", "libz.so",
          )

          res = subprocess.run(["ldd", str(app_dir / "Mine-imator")], capture_output=True, text=True, check=True)
          leaked = []
          missing = []
          for raw_line in res.stdout.splitlines():
              line = raw_line.strip()
              if "not found" in line:
                  missing.append(line)
              elif " => " in line:
                  name, right = line.split(" => ", 1)
                  name = name.strip()
                  resolved = Path(right.split()[0].strip()).resolve()
                  if not any(name.startswith(p) for p in HOST_ALLOWED):
                      if lib_dir not in resolved.parents:
                          leaked.append(f"{name} -> {resolved}")

          if missing:
              raise SystemExit("Missing libraries:\n" + "\n".join(missing))
          if leaked:
              raise SystemExit("Leaked non-bundled host libraries:\n" + "\n".join(leaked))
          print("Host-leak audit passed: all bundled libraries resolve from $ORIGIN/lib.")
          EOF

          # 2. Clean-room check on Ubuntu 24.04 (no Ubuntu 22.04 FFmpeg, SRT, OpenMP, or Qt5 installed)
          docker run --rm \
            -v /tmp/verify-linux/Mine-imator-Legacy-Reborn-Linux-x86_64:/app:ro \
            ubuntu:24.04 bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                libgl1 libegl1 libopengl0 libx11-6 libx11-xcb1 libxcb1 \
                libasound2t64 libfontconfig1 libdrm2 libgbm1 \
                libwayland-client0 libwayland-egl1 libwayland-cursor0 >/dev/null

              echo "=== Key resolved libraries inside clean Ubuntu 24.04 ==="
              ldd /app/Mine-imator | grep -E "libav|libsrt|libomp|libQt5" || true

              FAILED=0
              for target in /app/Mine-imator /app/lib/*.so* /app/plugins/*/*.so*; do
                [ -f "$target" ] || continue
                MISSING=$(ldd "$target" 2>&1 | grep "not found" || true)
                if [ -n "$MISSING" ]; then
                  echo "MISSING DEPS in $target:"
                  echo "$MISSING"
                  FAILED=1
                fi
              done

              if [ "$FAILED" -ne 0 ]; then
                exit 1
              fi
              echo "Clean-room Ubuntu 24.04 verification passed with 0 missing libraries."
            '

      - name: Package Debian (.deb)
        run: |
          rm -rf deb-staging
          mkdir -p deb-staging/usr/local/bin
          cp -r Installer/Linux/Mine-imator/. deb-staging/
          cp -r package/Mine-imator-Legacy-Reborn-Linux-x86_64 deb-staging/usr/local/bin/Mine-imator-Legacy-Reborn
          dpkg-deb --root-owner-group --build deb-staging Mine-imator-Legacy-Reborn-Linux-x86_64.deb

      - name: Build and Push GitHub Package (GHCR)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/mine-imator-legacy-reborn"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')

          RAW_TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          IMAGE_VERSION="${RAW_TAG#v}"
          IMAGE_VERSION="${IMAGE_VERSION:-1.1.0}"

          cat << EOF > Dockerfile
          FROM ubuntu:22.04
          LABEL org.opencontainers.image.title="Mine-imator: Legacy Reborn Build"
          LABEL org.opencontainers.image.description="An enhanced edition of Mine-imator with maxed out features for fast renders on weaker hardware."
          LABEL org.opencontainers.image.source="https://github.com/omardotcontent/Mine-Imator-Legacy-Reborn"
          LABEL org.opencontainers.image.version="${IMAGE_VERSION}"
          LABEL org.opencontainers.image.authors="OmarDotContent"
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update && apt-get install -y --no-install-recommends \
              libgl1-mesa-glx libgl1-mesa-dri libegl1 libopengl0 \
              libx11-6 libx11-xcb1 libxcb1 \
              libasound2 libfontconfig1 libdrm2 libgbm1 \
              libwayland-client0 libwayland-egl1 libwayland-cursor0 \
              ca-certificates \
              && rm -rf /var/lib/apt/lists/*
          WORKDIR /opt/mine-imator
          COPY package/Mine-imator-Legacy-Reborn-Linux-x86_64/ /opt/mine-imator/
          ENTRYPOINT ["/opt/mine-imator/Mine-imator"]
          EOF

          docker build -t "$IMAGE_NAME:$IMAGE_VERSION" -t "$IMAGE_NAME:latest" .
          docker push "$IMAGE_NAME:$IMAGE_VERSION"
          docker push "$IMAGE_NAME:latest"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            Mine-imator-Legacy-Reborn-Linux-x86_64.tar.gz
            Mine-imator-Legacy-Reborn-Linux-x86_64.deb

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'

      - name: Install vcpkg dependencies
        run: |
          vcpkg install zlib libzip freetype openal-soft --triplet x64-windows

      - name: Download & Extract FFmpeg
        shell: pwsh
        run: |
          curl.exe -L -f --retry 3 --retry-delay 5 -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg download failed' }
          $ffmpegDir = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Expand-Archive -Path 'ffmpeg.zip' -DestinationPath $ffmpegDir
          $ffmpegRoot = (Get-ChildItem -Path $ffmpegDir -Directory | Select-Object -First 1).FullName
          echo "FFMPEG_DIR=$ffmpegRoot" >> $env:GITHUB_ENV

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S CppProject -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCI_BUILD=ON `
            -DFFMPEG_DIR="$env:FFMPEG_DIR"

      - name: Build Mine-imator
        shell: pwsh
        run: |
          cmake --build build --config Release -j

      - name: Stage Windows Distribution
        shell: pwsh
        run: |
          $dist = 'dist/Mine-imator-Legacy-Reborn'
          New-Item -ItemType Directory -Path $dist -Force
          Copy-Item 'build/Release/Mine-imator-Legacy-Reborn.exe' $dist
          windeployqt.exe --release --no-translations --compiler-runtime "$dist/Mine-imator-Legacy-Reborn.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Qt deployment failed' }
          Copy-Item "$env:FFMPEG_DIR/bin/*.dll" $dist
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" $dist
          if (Test-Path "Installer/Windows/vcomp140_x64.dll") {
            Copy-Item 'Installer/Windows/vcomp140_x64.dll' "$dist/vcomp140.dll"
          }
          Copy-Item -Recurse 'GmProject/datafiles/Data' "$dist/Data"
          Copy-Item -Recurse 'GmProject/datafiles/Particles' "$dist/Particles"

      - name: Check packaged Windows startup
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'legacy-reborn-smoke'
          Copy-Item -Recurse 'dist/Mine-imator-Legacy-Reborn' $dist
          $env:QT_PLUGIN_PATH = $null
          $log = Join-Path $dist 'Data/log.txt'
          $process = Start-Process (Join-Path $dist 'Mine-imator-Legacy-Reborn.exe') `
            -ArgumentList '--check-startup' -WorkingDirectory $dist -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(180000)) {
            Stop-Process -Id $process.Id
            if (Test-Path $log) { Get-Content $log -Tail 50 }
            throw 'Windows startup check timed out'
          }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $log) -or -not (Select-String -Quiet -LiteralPath $log 'Startup check passed')) {
            if (Test-Path $log) {
              Select-String -LiteralPath $log -Pattern 'shader failed|error X\d+|FATAL ERROR|Shader check'
              Get-Content $log -Tail 50
            }
            throw "Windows startup check failed with exit code $($process.ExitCode)"
          }

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/Mine-imator-Legacy-Reborn' -DestinationPath 'Mine-imator-Legacy-Reborn-Windows-x64.zip'

      - name: Create Inno Setup Installer
        shell: pwsh
        run: |
          $dist = (Resolve-Path 'dist/Mine-imator-Legacy-Reborn').Path
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppSourceDir=$dist" Installer/Windows/setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          Move-Item "Installer/Windows/installer.exe" "Mine-imator-Legacy-Reborn-Windows-x64-Installer.exe"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            Mine-imator-Legacy-Reborn-Windows-x64.zip
            Mine-imator-Legacy-Reborn-Windows-x64-Installer.exe

  release:
    name: Publish Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact files
        run: |
          mkdir -p release-files
          find artifacts -type f -exec cp {} release-files/ \;
          ls -la release-files

      - name: Validate release tag selection
        id: vars
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
          TAG_MODE: ${{ github.event.inputs.tag_mode }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            TAG_MODE="use-existing"
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG (expected e.g. v1.1.0)" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            TAG_EXISTS=true
          else
            TAG_EXISTS=false
          fi
          if [ "$TAG_MODE" = "use-existing" ] && [ "$TAG_EXISTS" != "true" ]; then
            echo "Tag $RELEASE_TAG does not exist. Choose create-new or select an existing tag." >&2
            exit 1
          fi
          if [ "$TAG_MODE" = "create-new" ] && [ "$TAG_EXISTS" = "true" ]; then
            echo "Tag $RELEASE_TAG already exists. Choose use-existing or enter a new tag." >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Mine-Imator: Legacy Reborn"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            # Mine-Imator: Legacy Reborn

            Welcome to the official v1.1.0 release of **Mine-Imator: Legacy Reborn**, maintained by **OmarDotContent**.

            This project brings the lightweight pre-2.0 render pipeline back to life, optimized to run smoothly on weaker and older hardware while integrating modern visual features from community projects.

            ### Features and Highlights

            #### Performance and Core Pipeline
            - Pre-2.0 Render Pipeline: Restored and optimized to run smoothly on weaker and older hardware.
            - PBR Support on Older Pipeline: Physically Based Rendering integrated directly into the lightweight pipeline.
            - SuperSampling (SSAA): High-resolution supersampling anti-aliasing for clean renders.
            - Unlocked Viewport FPS: Unlimited viewport framerate with background FPS limiting to save system resources.
            - Auto-Save System: Automatic project saving to prevent lost work.

            #### Lighting and Shadows
            - Object Light Emission: EMIT light support on any object.
            - Volumetric Lighting: Volumetric fog and beam features integrated from community projects.
            - Contact Shadows: Detailed contact shadow rendering for grounded objects.
            - Cloud and Stained Glass Shadows: Realistic shadow casting through clouds and colored stained glass.
            - Light Gobos: Custom gobo textures for spot lights.
            - Hemisphere Sky and Ground Lighting: Natural ambient lighting calculation from the sky and ground.
            - Rim and Backlight Highlighting: Controllable rim lighting for character separation and dramatic scenes.

            #### Visual Effects and Post-Processing
            - Screen Space Reflections (SSR): Dynamic surface reflections.
            - Planar Mirror: Real-time planar reflection surfaces.
            - Water Ripples and Rain Puddles: Animated water interaction and rain puddle surfaces.
            - Sun Lens Flare: Cinematic camera lens flares.
            - Sun God Rays: Volumetric sun shafts through geometry and fog.
            - Weather and Lens Drops: Dynamic weather precipitation and lens water drop effects.
            - Motion Blur, Zoom Blur, and Speed Lines: Post-processing motion blur, radial zoom blur, and anime-style speed lines.

            #### Models and Media
            - Custom Model Support: Import external OBJ, glTF, and GLB models.
            - Video Placer with Audio Track: Place video files directly onto surfaces in the 3D viewport with synchronized audio playback.

            #### Animation and Workflow
            - Interactive Gizmos: Viewport transform gizmos for intuitive translating, rotating, and scaling.
            - Animation Modifiers: Procedural animation modifiers for secondary motion and automated animation passes.
            - Scale and Stretch Keyframes: Full timeline keyframing support for squash, stretch, and non-uniform scaling.

            ### Downloads
            - **Windows (x64)**:
              - `Mine-imator-Legacy-Reborn-Windows-x64-Installer.exe` (Installer)
              - `Mine-imator-Legacy-Reborn-Windows-x64.zip` (Portable ZIP)
            - **Linux (x86_64)**:
              - `Mine-imator-Legacy-Reborn-Linux-x86_64.deb` (Debian/Ubuntu package)
              - `Mine-imator-Legacy-Reborn-Linux-x86_64.tar.gz` (Portable tarball)
            - **Container Package**:
              - Available on GitHub Packages as `ghcr.io/omardotcontent/mine-imator-legacy-reborn:1.1.0`
          files: |
            release-files/*
